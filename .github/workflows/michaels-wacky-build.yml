name: Build
on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        default: '10.0.x'
      solution:
        type: string
        required: true
      fantomas-paths:
        type: string
        default: 'src/ tests/'
      example-projects:
        description: 'Space-separated paths to example .fsproj/.csproj files to build. Leave empty to auto-discover from examples/ directory, or set to "none" to skip.'
        type: string
        default: ''
      check-docs:
        type: boolean
        default: true
      syncdocs-cmd:
        type: string
        default: 'dotnet tool run syncdocs'
      coverageratchet-cmd:
        type: string
        default: 'dotnet tool run coverageratchet'
      coverage-exclude:
        description: >-
          Space/newline-separated project names (test folder minus ".Tests", e.g.
          "RefStamp") whose tests run without coverage collection. For packages
          with no instrumentable code, whose empty coverage would fail the summary.
        type: string
        default: ''
      paket-restore:
        description: 'Run paket restore after tool restore (for projects using Paket git dependencies)'
        type: boolean
        default: false
      pre-build-cmd:
        description: 'Command to run after restore/tool-restore but before build (e.g. code generation)'
        type: string
        default: ''
      test-extra-args:
        description: 'Extra arguments appended to dotnet test (e.g. --ignore-exit-code 7)'
        type: string
        default: ''
      lint-cmd:
        description: 'Command to run for the Lint step. Empty string uses the default `dotnet fsharplint lint <solution>`. Override to e.g. `dotnet run --project src/MyCli -- analyze --run-once` when hosting analyzers in-process.'
        type: string
        default: ''
      test-windows:
        description: >-
          Also build and test on windows-latest in a separate `test-windows` job
          (build + tests only; format, lint, docs and coverage stay on Linux).
        type: boolean
        default: false
      test-macos:
        description: >-
          Also build and test on macos-latest in a separate `test-macos` job
          (build + tests only; format, lint, docs and coverage stay on Linux).
        type: boolean
        default: false
      failure-artifacts:
        description: >-
          Newline-separated globs uploaded as an artifact when the job fails.
          Defaults to the fshw per-test verdicts and logs, since the console only
          prints `failed: N`. Missing paths are ignored; "none" disables it.
        type: string
        default: |
          .fshw/test-runs/**
          .fshw/**/*.log

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet tool restore
      - name: Paket restore
        if: inputs.paket-restore
        run: dotnet tool run paket restore
      - run: dotnet restore
      - name: Pre-build
        if: inputs.pre-build-cmd != ''
        run: ${{ inputs.pre-build-cmd }}
      - name: Format check
        run: dotnet fantomas ${{ inputs.fantomas-paths }} --check
      - name: Sync docs check
        run: ${{ inputs.syncdocs-cmd }} check
      - name: Build
        run: dotnet build --warnaserror --no-restore
      # The same command michaels-wacky-release.yml builds with. Some errors exist
      # only in an optimised build: e.g. an `inline` internal function called from
      # an InternalsVisibleTo test assembly compiles in Debug (where it is not
      # inlined) and fails with FS1116/FS1118 in Release. Building Release here
      # makes such an error fail the commit that introduced it rather than the
      # release cut from it. Outputs go to bin/Release, so the Debug outputs the
      # later steps run `--no-build` against are untouched.
      - name: Build (Release)
        run: dotnet build -c Release --no-restore -p:ReleaseBuild=true
      - name: Lint
        timeout-minutes: 15
        run: ${{ inputs.lint-cmd != '' && inputs.lint-cmd || format('dotnet fsharplint lint {0}', inputs.solution) }}
      - name: Generate docs
        if: inputs.check-docs
        run: dotnet fsdocs build --output output/docs --clean
      - name: Test with coverage
        id: test-coverage
        run: |
          # Word-splitting is intentional: names have no spaces.
          exclude="${{ inputs.coverage-exclude }}"
          for proj in $(find tests -name '*.Tests.fsproj' | sort); do
            project_name=$(basename "$(dirname "$proj")" | sed 's/\.Tests$//')
            # --no-build/--no-restore: the Build step already compiled the tests.
            skip=0
            for ex in $exclude; do
              [ "$ex" = "$project_name" ] && skip=1
            done
            if [ "$skip" = 1 ]; then
              echo "Testing $proj (coverage SKIPPED — '$project_name' in coverage-exclude)"
              dotnet test --project "$proj" \
                --no-build \
                --no-restore \
                ${{ inputs.test-extra-args }}
              continue
            fi
            echo "Testing $proj (coverage -> coverage/$project_name/)"
            dotnet test --project "$proj" \
              --no-build \
              --no-restore \
              --coverage \
              --coverage-output-format cobertura \
              --coverage-output "${{ github.workspace }}/coverage/$project_name/coverage.cobertura.xml" \
              ${{ inputs.test-extra-args }}
          done
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/*/coverage.cobertura.xml
          targetdir: coverage/report
          reporttypes: 'HtmlInline;MarkdownSummaryGithub'
      - name: Coverage summary
        id: coverage-summary
        run: |
          # Markdown summary + badge for the PR comment. Fails on an empty
          # coverage document: the tests instrumented no product code (use
          # coverage-exclude for packages that have none).
          shopt -s nullglob
          files=(coverage/*/coverage.cobertura.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No coverage files found; nothing to summarize."
            echo "No coverage files were produced." > code-coverage-results.md
            exit 0
          fi

          total_covered=0
          total_valid=0
          empty_found=0
          rows=""

          for f in "${files[@]}"; do
            pkg=$(basename "$(dirname "$f")")
            # grep -oE, not -P: portable to BSD grep.
            classes=$(grep -c '<class ' "$f" || true)
            covered=$(grep -oE 'lines-covered="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || true)
            valid=$(grep -oE 'lines-valid="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || true)
            covered=${covered:-0}
            valid=${valid:-0}
            if [ "${classes:-0}" -eq 0 ] || [ "$valid" -eq 0 ]; then
              echo "::error file=$f::Empty coverage for '$pkg': tests instrumented no product code. If this package legitimately ships no instrumentable code, add '$pkg' to coverage-exclude in the caller workflow."
              empty_found=1
              rows="${rows}| **${pkg}** | :warning: empty | 0 |"$'\n'
              continue
            fi
            rate=$(awk "BEGIN { printf \"%.1f\", (100*$covered/$valid) }")
            rows="${rows}| ${pkg} | ${rate}% | ${covered}/${valid} |"$'\n'
            total_covered=$((total_covered + covered))
            total_valid=$((total_valid + valid))
          done

          if [ "$total_valid" -gt 0 ]; then
            overall=$(awk "BEGIN { printf \"%.1f\", (100*$total_covered/$total_valid) }")
          else
            overall="0.0"
          fi
          if awk "BEGIN { exit !($overall >= 70) }"; then color=brightgreen
          elif awk "BEGIN { exit !($overall >= 50) }"; then color=yellow
          else color=red
          fi

          {
            echo "![Coverage](https://img.shields.io/badge/coverage-${overall}%25-${color})"
            echo ""
            echo "| Package | Line rate | Lines |"
            echo "|---|---:|---:|"
            printf '%s' "$rows"
            echo ""
            echo "**Overall:** ${overall}% (${total_covered}/${total_valid} lines)"
          } > code-coverage-results.md

          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$empty_found" -eq 1 ]; then
            echo "Coverage summary failed: empty coverage document(s) found (see errors above)."
            exit 1
          fi
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Coverage ratchet check
        run: |
          for config in coverage-ratchet-*.json; do
            [ -f "$config" ] || continue
            project=$(echo "$config" | sed 's/coverage-ratchet-\(.*\)\.json/\1/')
            echo "Checking $project..."
            (cd "coverage/$project" && ${{ inputs.coverageratchet-cmd }} check "${{ github.workspace }}/$config")
          done
      - name: Coverage thresholds artifact
        if: always() && steps.test-coverage.outcome == 'success'
        run: |
          for config in coverage-ratchet-*.json; do
            [ -f "$config" ] || continue
            project=$(echo "$config" | sed 's/coverage-ratchet-\(.*\)\.json/\1/')
            echo "Generating thresholds for $project..."
            # Non-zero exactly when a file fails coverage, which is when
            # loosen-from-ci needs this artifact, so ignore the exit code.
            (cd "coverage/$project" && ${{ inputs.coverageratchet-cmd }} check-json "${{ github.workspace }}/$config" "${{ github.workspace }}/coverage-thresholds-${project}.json") || true
            if [ ! -s "coverage-thresholds-${project}.json" ]; then
              echo "::warning::check-json produced no output for $project; skipping artifact entry"
              rm -f "coverage-thresholds-${project}.json"
            fi
          done
      - name: Upload coverage thresholds
        if: always() && steps.test-coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-thresholds
          path: coverage-thresholds-*.json
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/report
      - name: Upload failure diagnostics
        if: failure() && inputs.failure-artifacts != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-diagnostics
          path: ${{ inputs.failure-artifacts }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Build examples
        run: |
          if [ "${{ inputs.example-projects }}" = "none" ]; then
            echo "Skipping examples (explicitly disabled)"
            exit 0
          fi

          if [ -n "${{ inputs.example-projects }}" ]; then
            projects="${{ inputs.example-projects }}"
          else
            projects=$(find examples -name '*.fsproj' -o -name '*.csproj' 2>/dev/null | sort)
          fi

          if [ -z "$projects" ]; then
            echo "No example projects found"
            exit 0
          fi

          # Word-splitting is intentional: project paths have no spaces.
          for proj in $projects; do
            echo "Building example: $proj"
            dotnet build "$proj" --warnaserror
          done

  # Not a matrix on `build`, so Linux-only steps need no OS guards and the
  # `build` check keeps its name. Each opted-in OS reports as `test-<os>`.
  test-os:
    if: inputs.test-windows || inputs.test-macos
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            inputs.test-windows && inputs.test-macos && '["windows","macos"]'
            || inputs.test-windows && '["windows"]'
            || '["macos"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet tool restore
      - name: Paket restore
        if: inputs.paket-restore
        run: dotnet tool run paket restore
      - run: dotnet restore
      - name: Pre-build
        if: inputs.pre-build-cmd != ''
        shell: bash
        run: ${{ inputs.pre-build-cmd }}
      - name: Build
        run: dotnet build --warnaserror --no-restore
      - name: Test
        shell: bash
        run: |
          # Windows runners default to pwsh; this loop needs bash.
          # Runs every project, then fails, so one run shows all failures.
          failed=()
          for proj in $(find tests -name '*.Tests.fsproj' | sort); do
            echo "::group::$proj"
            dotnet test --project "$proj" --no-build --no-restore ${{ inputs.test-extra-args }} || failed+=("$proj")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::tests failed in %s\n' "${failed[@]}"
            exit 1
          fi
