name: Deploy Docs
on:
  push:
    tags:
      - 'syncdocs-v*'
      - 'fssemantictagger-v*'
      - 'fsprojlint-v*'
  # Redeploy the docs from a branch without a release: gh workflow run docs.yml --ref main
  workflow_dispatch:

concurrency:
  group: docs-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: ./.github/workflows/michaels-wacky-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
