name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Run CI (including the Windows job) on any branch: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/michaels-wacky-build.yml
    with:
      solution: FSharpOssTooling.slnx
      # Keep in step with global.json: branch counts differ per SDK band, so
      # re-measure the coverage floors when you move it.
      dotnet-version: '10.0.4xx'
      test-windows: true
      fantomas-paths: "src/ tests/"
      syncdocs-cmd: "dotnet run --project $GITHUB_WORKSPACE/src/SyncDocs/SyncDocs.fsproj --"
      # MSBuild-targets-only package: its tests instrument nothing.
      coverage-exclude: RefStamp
    permissions:
      contents: read
      checks: write
      pull-requests: write

  lint-project:
    uses: ./.github/workflows/michaels-wacky-lint-project.yml
    permissions:
      contents: read
